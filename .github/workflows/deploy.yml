name: Deploy FinanceBot

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executar comandos via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/portfolio/finance-bot
            git pull origin main
            # --build reconstrói a imagem com o código novo (o COPY . . invalida o cache)
            # e recria o container — já é o restart do deploy, não precisa de restart à parte
            docker compose up -d --build