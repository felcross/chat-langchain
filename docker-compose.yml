finance-bot:
    build: .
    container_name: finance-bot-app
    restart: always
    env_file:
      - .env
    volumes:
      - ./finance.db:/app/finance.db       # Persiste o banco DuckDB
      - ./query_logs.jsonl:/app/query_logs.jsonl # Persiste os logs
      - ./.cache:/app/.cache               # Mantém o cache de IA
    networks:
      - rede_vps