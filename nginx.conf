# nginx.conf — Proxy reverso para o Streamlit
#
# O Streamlit usa WebSockets para atualização em tempo real.
# As diretivas proxy_set_header abaixo são OBRIGATÓRIAS para WebSocket funcionar.
# Sem elas, o app abre mas congela ou não atualiza.

server {
    listen 80;
    server_name _;              # aceita qualquer domínio/IP — troque pelo seu domínio

    # Tamanho máximo de upload (CSV do usuário)
    client_max_body_size 50M;

    location / {
        proxy_pass         http://financebot:8501;
        proxy_http_version 1.1;

        # Headers obrigatórios para WebSocket (Streamlit)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts generosos para queries longas
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }
}